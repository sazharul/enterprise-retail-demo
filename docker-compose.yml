services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: glowcart
      MYSQL_USER: glowcart
      MYSQL_PASSWORD: secret
    ports:
      - "3309:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8002:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8002
      DEMO_MODE: "true"
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: glowcart
      DB_USERNAME: glowcart
      DB_PASSWORD: secret
      MAIL_MAILER: log
    depends_on:
      mysql:
        condition: service_healthy
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]

  catalog-api:
    build: ./catalog-api
    ports:
      - "4001:4001"
    environment:
      DB_HOST: mysql
      DB_USER: glowcart
      DB_PASSWORD: secret
      DB_NAME: glowcart
      PORT: 4001
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5174:5174"
    environment:
      VITE_API_URL: http://localhost:8002/api
      VITE_NODE_API_URL: http://localhost:4001/api/node
      VITE_ASSET_URL: http://localhost:8002
    depends_on:
      - backend
      - catalog-api

volumes:
  mysql_data:
